<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>Café Lumière | 予約</title>
        <!-- サイト説明文 -->
        <meta name="description" content="ナチュラルで落ち着いた雰囲気のカフェ「Café Lumière」のWebサイトです。" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="format-detection" content="telephone=no,email=no,address=no" />
        <!-- 本サイトのURL(絶対パス)を記載(分散ページのSEO対策) -->
        <link rel="canonical" href="#" />
        <!-- ファビコン -->
        <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

        <!-- OGP -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="#" />
        <meta property="og:title" content="Café Lumière | 予約" />
        <meta property="og:description" content="ナチュラルで落ち着いた雰囲気のカフェ「Café Lumière」のWebサイトです。" />
        <meta property="og:site_name" content="Café Lumière" />
        <meta property="og:image" content="img/ogp.jpg" />
        <meta property="og:locale" content="ja_JP" />

        <!-- Import Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Oleo+Script+Swash+Caps:wght@400;700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- Material Icon -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=keyboard_arrow_down,keyboard_arrow_left,keyboard_arrow_right,keyboard_double_arrow_right"
        />
        <!-- Import CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css" />
        <link rel="stylesheet" href="css/style.css" />

        <!-- Import JS/jQuery Library -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    </head>
    <body class="reservation">
        <!-- *ヘッダー================== -->
        <header class="l-header">
            <div class="l-containerL l-header__inner">
                <h2 class="c-logo c-logo--big"><a href="./index.html" class="c-logo-link">Café Lumière</a></h2>
                <nav class="l-header__gnav">
                    <ul class="l-header__list">
                        <li class="l-header__item"><a href="blog.html" class="">Blog / News</a></li>
                        <li class="l-header__item"><a href="menu.html" class="">Menu</a></li>
                        <li class="l-header__item"><a href="#" class="">Resevation</a></li>
                        <li class="l-header__item"><a href="information.html" class="">Information</a></li>
                    </ul>
                </nav>
                <!-- *ハンバーガーメニュー -->
                <button type="button" class="l-header__menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <main class="main">
            <section class="l-section l-section--first l-section--subpage p-reservation">
                <div class="l-containerM">
                    <h1 class="c-heading-subpage">Reservation</h1>

                    <!-- form -->
                    <form action="#" method="post" class="p-form">
                        <div class="p-form__area">
                            <label for="name" class="p-form__label">お名前<span class="c-form-required">※必須</span></label>
                            <input type="text" name="name" id="name" class="p-form__input" placeholder="山田太郎" autofocus required />
                        </div>
                        <div class="p-form__area">
                            <div class="p-form__label p-form__label--tel">
                                <label for="tel" class="">電話番号<span class="p-form__note">(ハイフンなしで入力してください)</span></label>
                                <span class="c-form-required">※必須</span>
                            </div>
                            <input type="tel" name="tel" id="tel" class="p-form__input" placeholder="例: 99999999999" required />
                        </div>
                        <div class="p-form__area">
                            <label for="mail" class="p-form__label">メールアドレス</label>
                            <input type="email" name="mail" id="mail" class="p-form__input" placeholder="例: aaa@aaa.aa" />
                        </div>

                        <!-- * ご予約人数 ======================== -->
                        <div class="p-form__area">
                            <label for="num" class="p-form__label">ご予約人数<span class="c-form-required">※必須</span></label>

                            <div class="p-form__select-area">
                                <div class="p-form__select-wrapper">
                                    <select name="num" id="num" class="p-form__select-sm" required>
                                        <option value="" disabled selected>&nbsp;</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                    </select>
                                </div>
                                <div>名様</div>
                            </div>
                            <!-- /.p-form__select-area -->
                        </div>
                        <!-- /.p-form__area -->

                        <!-- * ご予約日時 ======================== -->
                        <div class="p-form__area">
                            <div class="p-form__fieldset">
                                <fieldset>
                                    <legend>
                                        <span class="p-form__label">ご予約日時<span class="c-form-required">※必須</span></span>
                                    </legend>
                                    <!-- * 月日 -->
                                    <div class="p-form__month">
                                        <div class="p-form__select-area-wrapper">
                                            <div class="p-form__select-area">
                                                <div class="p-form__select-wrapper">
                                                    <select name="month" id="month" class="p-form__select-sm">
                                                        <option value="1">1</option>
                                                        <option value="2">2</option>
                                                        <option value="3">3</option>
                                                        <option value="4">4</option>
                                                        <option value="5">5</option>
                                                        <option value="6">6</option>
                                                        <option value="7">7</option>
                                                        <option value="8">8</option>
                                                        <option value="9">9</option>
                                                        <option value="10">10</option>
                                                        <option value="11">11</option>
                                                        <option value="12">12</option>
                                                    </select>
                                                </div>
                                                月
                                                <!-- 日 月変更したらJSで子要素option追加 曜日変更-->
                                                <div class="p-form__select-wrapper">
                                                    <select name="date" id="date" class="p-form__select-sm p-form__select-wrapper"></select>
                                                </div>
                                                日
                                            </div>
                                            <!-- /.p-form__select-area -->
                                            <div>( <span class="p-form__day-of-week"></span>)</div>
                                        </div>
                                        <!-- /.p-form__select-area-wrapper -->
                                    </div>
                                    <!-- /.p-form__month -->

                                    <!-- * 時分 -->
                                    <div class="p-form__hour">
                                        <div class="p-form__select-area-wrapper">
                                            <div class="p-form__select-area">
                                                <!-- JSで子要素option追加 -->
                                                <div class="p-form__select-wrapper">
                                                    <select name="hour" id="hour" class="p-form__select-sm"></select>
                                                </div>
                                                時
                                                <!-- 15分刻み -->
                                                <div class="p-form__select-wrapper">
                                                    <select name="minutes" id="minutes" class="p-form__select-sm">
                                                        <option value="00">00</option>
                                                        <option value="15">15</option>
                                                        <option value="30">30</option>
                                                        <option value="45">45</option>
                                                    </select>
                                                </div>
                                                分
                                            </div>
                                            <!-- /.p-form__select-area -->
                                        </div>
                                        <!-- /.p-form__select-area-wrapper -->
                                    </div>
                                    <!-- /.p-form__hour -->
                                </fieldset>
                            </div>
                            <!-- /.p-form__fieldset -->
                        </div>
                        <!-- /.p-form__area -->

                        <!-- * 希望の座席 ======================== -->
                        <div class="p-form__area">
                            <label for="seat" class="p-form__label">希望の座席</label>
                            <div class="p-form__select-wrapper">
                                <select name="seat" id="seat" class="p-form__select-100per">
                                    <option value="特になし">特になし</option>
                                    <option value="テーブル">テーブル</option>
                                    <option value="ソファ">ソファ</option>
                                    <option value="カウンター">カウンター</option>
                                </select>
                            </div>
                        </div>

                        <!-- * 備考 ======================== -->
                        <div class="p-form__area">
                            <label for="option" class="p-form__label">備考</label>
                            <textarea name="option" id="option" class="p-form__textarea"></textarea>
                        </div>

                        <!-- * 確認ボタン ======================== -->
                        <div class="p-btn-confirm-wrapper"><button type="submit" class="c-btn c-btn--primary js-open-modal">予約内容の確認</button></div>
                    </form>

                    <!-- * 確認ダイアログ ======================== -->
                    <div class="p-dialog-wrapper">
                        <dialog id="dialog" class="p-dialog">
                            <h2 class="p-dialog__heading">まだご予約は完了していません！</h2>
                            <p class="p-dialog__text">以下の内容でご予約を承ります。<br />よろしいですか？</p>
                            <div class="p-dialog__confirm-area">
                                <dl class="p-dialog__dl">
                                    <!-- * JSで入力した項目埋める ======================== -->
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">お名前:</dt>
                                        <!-- 末尾に「様」 -->
                                        <dd class="p-dialog__inputed p-dialog__inputed--name"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">電話番号:</dt>
                                        <dd class="p-dialog__inputed p-dialog__inputed--tel"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">メールアドレス:</dt>
                                        <dd class="p-dialog__inputed p-dialog__inputed--mail"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">ご予約人数:</dt>
                                        <!-- 末尾に「名様」 -->
                                        <dd class="p-dialog__inputed p-dialog__inputed--num"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">ご予約日時:</dt>
                                        <dd class="p-dialog__inputed p-dialog__inputed--date"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">希望の座席:</dt>
                                        <dd class="p-dialog__inputed p-dialog__inputed--seat"></dd>
                                    </div>
                                    <div class="p-dialog__dl-item">
                                        <dt class="p-dialog__title">備考:</dt>
                                        <dd class="p-dialog__inputed p-dialog__inputed--option"></dd>
                                    </div>
                                </dl>
                            </div>
                            <div class="p-btn-confirm-wrapper"><button type="button" class="c-btn c-btn--primary p-dialog__confirm">予約を確定する</button></div>
                            <div class="p-btn-cancel-wrapper"><button type="button" class="c-btn c-btn--cancel p-dialog__cancel">入力画面に戻る</button></div>
                        </dialog>
                    </div>
                    <!-- /.p-dialog-wrapper -->
                    <dialog class="p-dialog-gotcha">予約を受け付けました。<button type="button" class="p-dialog-gotcha__close">OK</button></dialog>
                </div>
                <!-- /.l-containerS -->
            </section>
        </main>

        <!-- *フッター================== -->
        <footer class="l-footer">
            <div class="l-containerS">
                <div class="l-footer__inner">
                    <div class="c-logo c-logo--small"><a href="./index.html" class="c-logo-link">Café Lumière</a></div>
                    <ul class="l-footer__list">
                        <li class="l-footer__item"><a href="./blog.html" class="l-footer__link">Blog / News</a></li>
                        <li class="l-footer__item"><a href="menu.html" class="l-footer__link">Menu</a></li>
                        <li class="l-footer__item"><a href="#" class="l-footer__link">Resevation</a></li>
                        <li class="l-footer__item"><a href="information.html" class="l-footer__link">Information</a></li>
                    </ul>
                    <ul class="c-sns-list">
                        <li class="c-sns-list__item c-sns-list__item--instagram">
                            <a href="#"><img src="img/logo_Instagram.png" alt="" /></a>
                        </li>
                        <li class="c-sns-list__item c-sns-list__item--x">
                            <a href="#"><img src="img/logo_x.png" alt="" /></a>
                        </li>
                        <li class="c-sns-list__item c-sns-list__item--facebook">
                            <a href="#"><img src="img/logo_Facebook.png" alt="" /></a>
                        </li>
                    </ul>
                </div>
                <!-- /.l-footer__inner -->
                <small class="l-footer__copyright">© Café Lumière</small>
            </div>
            <!-- /.l-containerS -->
        </footer>

        <!-- Import JS -->
        <script src="./js/main.js"></script>
    </body>
</html>
